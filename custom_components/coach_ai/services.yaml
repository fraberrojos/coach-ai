generate_daily_report:
  name: Generar informe diario
  description: Genera el informe diario de Coach AI.

export_workout:
  name: Exportar entrenamiento
  description: Exporta el entrenamiento actual de Coach AI.

upload_workout_to_garmin:
  name: Subir entrenamiento a Garmin
  description: Sube el entrenamiento actual a Garmin Connect sin programarlo.

upload_and_schedule_workout_to_garmin:
  name: Subir y programar entrenamiento en Garmin
  description: Sube el entrenamiento actual a Garmin Connect y lo programa en el calendario.
  fields:
    date:
      name: Fecha
      description: Fecha en la que se debe programar el entrenamiento.
      required: true
      example: "2026-09-29"
      selector:
        date:
garmin_check_schedule:
  name: Diagnóstico Garmin
  description: Consulta los entrenamientos programados en Garmin sin crear ni modificar ninguno.

garmin_compare_schedule:
  name: Comparar Garmin
  description: Compara los entrenamientos programados en Garmin con la planificación de Coach AI sin modificar Garmin.
